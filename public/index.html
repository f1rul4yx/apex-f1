<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121513">
    <meta name="description" content="APEX Pit Wall: datos de Fórmula 1 en vivo, estrategia y telemetría en tu propio equipo, sin suscripción.">
    <title>APEX — Pit Wall</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Saltar a la clasificación</a>
    <header class="topbar">
      <a class="brand" href="#" aria-label="APEX Pit Wall">
        <svg viewBox="0 0 40 32" aria-hidden="true"><path d="M3 27 16 5h9L12 27H3Zm15 0 7-12 5 12H18Zm11-22h8l-5 8h-8l5-8Z" fill="currentColor"/></svg>
        APEX<span class="brand-slash">/</span><span class="brand-sub">PIT WALL</span>
      </a>
      <nav class="main-nav" aria-label="Vistas">
        <button class="nav-link active" data-view="timing" type="button"><span class="nav-number">01</span>En vivo</button>
        <button class="nav-link" data-view="strategy" type="button"><span class="nav-number">02</span>Estrategia</button>
        <button class="nav-link" data-view="explorer" type="button"><span class="nav-number">03</span>Explorador <span id="topic-count" class="topic-count"></span></button>
      </nav>
      <div class="header-tools">
        <span class="connection-badge" id="connection-badge" role="status"><span class="status-dot"></span><span id="connection-label">INICIANDO</span></span>
        <button class="icon-button" id="fullscreen-button" type="button" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
      </div>
    </header>
    <main id="main-content" tabindex="-1">
      <div class="initial-loader"><span class="loader-flag"></span><p>Preparando tu muro de boxes…</p><small>Conectando directamente con F1 Live Timing.</small></div>
    </main>
    <footer class="app-footer">
      <span><span class="footer-pulse"></span> DATOS DIRECTOS · SIN SERVICIOS DE PAGO · USO PERSONAL</span>
      <span>Fuente experimental no oficial. APEX no está afiliado con Formula 1, FIA ni los equipos.</span>
    </footer>
    <dialog id="driver-dialog" aria-labelledby="driver-title" class="driver-dialog">
      <button class="dialog-close" type="button" aria-label="Cerrar">×</button>
      <div id="driver-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
